<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="#087F8C"/>
    </marker>
  </defs>
  <rect width="1200" height="740" fill="#F7F9FC"/>
  <g font-family="Arial" fill="#172D45">
    <text x="55" y="65" font-size="32" font-weight="bold">One question, one tool, one complete answer</text>
    <text x="55" y="107" font-size="21">The model proposes. Python validates and executes.</text>
    <g fill="#FFFFFF" stroke="#DCE5ED" stroke-width="2">
      <rect x="60" y="180" width="235" height="235" rx="14"/>
      <rect x="340" y="180" width="235" height="235" rx="14"/>
      <rect x="620" y="180" width="235" height="235" rx="14"/>
      <rect x="900" y="180" width="235" height="235" rx="14"/>
    </g>
    <g fill="#087F8C" font-size="29" font-weight="bold">
      <text x="85" y="230">01</text><text x="365" y="230">02</text>
      <text x="645" y="230">03</text><text x="925" y="230">04</text>
    </g>
    <g font-size="24" font-weight="bold">
      <text x="85" y="285">User question</text><text x="365" y="285">Assistant call</text>
      <text x="645" y="285">Python tool</text><text x="925" y="285">Assistant answer</text>
    </g>
    <g font-size="20">
      <text x="85" y="335">When is the</text><text x="85" y="365">workshop?</text>
      <text x="365" y="335">lookup_faq</text><text x="365" y="365">topic: schedule</text>
      <text x="645" y="335">Validate, look up,</text><text x="645" y="365">return the fact</text>
      <text x="925" y="335">Use the returned</text><text x="925" y="365">schedule fact</text>
    </g>
    <g stroke="#087F8C" stroke-width="3" marker-end="url(#arrow)">
      <line x1="300" y1="300" x2="330" y2="300"/>
      <line x1="580" y1="300" x2="610" y2="300"/>
      <line x1="860" y1="300" x2="890" y2="300"/>
    </g>
    <rect x="60" y="465" width="1075" height="100" rx="14" fill="#E6F3F3"/>
    <text x="85" y="505" font-size="23" font-weight="bold">The tool result goes back into the conversation before the final model response.</text>
    <text x="85" y="540" font-size="20">The request and result are linked by tool_call_id. The loop has a round limit.</text>
    <text x="60" y="625" font-size="20">Offline mode is scripted keyword matching, not an LLM. It uses the same Python loop.</text>
    <text x="60" y="665" font-size="20">Add a FAQ topic to change tool data. That is not model training.</text>
  </g>
</svg>
